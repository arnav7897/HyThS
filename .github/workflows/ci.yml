name: Scaffold checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presets:
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan-ubsan, tsan, coverage, fuzz, bench]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake --preset "${{ matrix.preset }}"
      - run: cmake --build --preset "${{ matrix.preset }}"
      - run: ctest --preset "${{ matrix.preset }}"
      - run: python3 -m unittest discover -s tests -v

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  compilers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: g++-12, cxx: g++-12 }
          - { package: g++-13, cxx: g++-13 }
          - { package: clang-16, cxx: clang++-16 }
          - { package: clang-17, cxx: clang++-17 }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev "${{ matrix.package }}"
      - run: cmake --preset debug -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18 cppcheck libssl-dev
      - run: clang-format-18 --dry-run --Werror src/*.cpp include/hta/*.hpp tests/*.cpp
      - run: cmake --preset debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: clang-tidy-18 -p build/debug src/*.cpp --warnings-as-errors='*'
      - run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c++17 -I include src tests/*.cpp

  container-repeatability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Compare two clean builds
        shell: bash
        run: |
          set -eu
          for build in first second; do
            docker build --no-cache --provenance=false -t "hta-check:$build" .
            docker run --rm "hta-check:$build" sh -c \
              "dpkg-query -W -f='\${binary:Package}=\${Version}\n' | LC_ALL=C sort; sha256sum /src/build/debug/scaffold_smoke /src/build/debug/framing_test /src/build/debug/parameters_test /src/build/debug/expand_message_test /src/build/debug/scalar_challenge_test /src/build/debug/secp256k1_public_test /src/build/debug/hash_to_field_test" > "/tmp/hta-$build.txt"
          done
          diff -u /tmp/hta-first.txt /tmp/hta-second.txt
